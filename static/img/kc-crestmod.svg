<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#124B40"/>
      <stop offset="55%" stop-color="#0F3A32"/>
      <stop offset="100%" stop-color="#08211D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0BC7A"/>
      <stop offset="50%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#B08A38"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer shield -->
  <path d="M100 4 L192 34 L192 118 C192 182 150 223 100 236
           C50 223 8 182 8 118 L8 34 Z"
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="4.5"
        stroke-linejoin="round" filter="url(#softShadow)"/>

  <!-- Inner hairline border -->
  <path d="M100 17 L178 43 L178 117 C178 172 143 208 100 219
           C57 208 22 172 22 117 L22 43 Z"
        fill="none" stroke="#D9BC7E" stroke-width="1.5" opacity="0.55"/>

  <!-- Top ornamental star -->
  <polygon points="100,50 105.5,65.5 122,66 109,76.5 113.5,92.5 100,83 86.5,92.5 91,76.5 78,66 94.5,65.5"
           fill="url(#goldGrad)"/>

  <!-- KC monogram -->
  <text x="100" y="147" font-family="Georgia, 'Times New Roman', serif" font-size="60"
        font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">KC</text>

  <!-- Divider flourish -->
  <line x1="62" y1="165" x2="138" y2="165" stroke="#D9BC7E" stroke-width="1.2" opacity="0.7"/>
  <circle cx="100" cy="165" r="2.2" fill="#D9BC7E"/>

  <!-- Est. text (smaller, refined) -->
  <text x="100" y="196" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5"
        font-weight="600" letter-spacing="2.6" fill="#F5EFE0" text-anchor="middle">EST. 1961</text>
</svg>
